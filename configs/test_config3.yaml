experiment_name: "f"
seed: 42
device: "cuda"

data_path: "datasets/sentences_with_embeddings1.pt"
train_split_ratio: 0.9
epochs: 5

model:
  output_dim: 64
  dropout: 0.9
  activation: "gelu"

training:
  batch_size: 16
  lr: 1.2e-4
  weight_decay: 0.01

loss:
  type: "hybrid_kd"
  alpha_kd: 0.7
  tau_cosent: 20

experiment_name: "Student_Distillation_v1"
seed: 42
device: "cuda"

data_path: "datasets/sentences_with_embeddings1.pt"
save_path: "output/"
kfolds: 2
epochs: 2

model:
  output_dim: 64
  dropout: 0.9
  activation: "gelu"

training:
  batch_size: 256
  lr: 5.0e-4
  weight_decay: 0.01

loss:
  type: "hybrid_kd" # hard_mse, soft_mse, hybrid_kd, cosent_rank
  alpha_kd: 0.7
  tau_cosent: 20


